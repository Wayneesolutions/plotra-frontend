# plotraa.com — nginx server block for the SEO / AI-search setup.
#
# Replace the current `location / { try_files $uri /index.html; }` style SPA
# fallback with the blocks below (keep your existing listen/ssl lines).
# Assumes:
#   - frontend `npm run build` output is deployed to /var/www/plotraa/dist
#   - plotra-backend API runs on 127.0.0.1:3001 (PM2 "api")
# After editing:  sudo nginx -t && sudo systemctl reload nginx
#
# What it does:
#   - prerendered marketing pages (dist/<route>/index.html) are served as-is
#   - /blog and /blog/<slug> are server-rendered by the backend (always fresh)
#   - /sitemap.xml is generated by the backend from the database
#   - app routes (dashboard, /p/<slug>, login …) get the empty SPA shell
#   - every other unknown URL returns a real HTTP 404 with dist/404.html

server {
    server_name plotraa.com www.plotraa.com;
    root /var/www/plotraa/dist;
    index index.html;

    # Don't block AI / search crawlers with rate limits on public pages.
    # (If you use limit_req anywhere, keep it on /api/ only.)

    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Server-rendered by the backend -------------------------------------
    # /blog list + every /blog/<slug> post (real 404 for unknown slugs)
    location = /blog {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /blog/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Dynamic sitemap with every published post
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
    # IndexNow key file (key comes from INDEXNOW_KEY in the backend .env)
    location ^~ /indexnow- {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # --- Public listing share links -----------------------------------------
    # Backend answers crawlers with OG tags and falls back to the SPA shell
    # for browsers (same behaviour as before).
    location ^~ /p/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 502 503 = @spa;
    }

    # --- App routes: empty SPA shell, no 404 --------------------------------
    location ~ ^/(dashboard|admin|login|forgot-password|reset-password|blog-admin|widget|showcase)(/|$) {
        try_files /app.html =404;
    }
    location @spa {
        try_files /app.html =404;
    }

    # --- Static assets (hashed file names) -----------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Everything else: prerendered page or a real 404 ---------------------
    location / {
        try_files $uri $uri/index.html =404;
    }
}
